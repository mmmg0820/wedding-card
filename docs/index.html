<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc,
    query, orderBy, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDpKI8drR3FBa8yuk8YrVoWLbJwqCdeQUs",
    authDomain: "wedding-card-915f0.firebaseapp.com",
    projectId: "wedding-card-915f0",
    storageBucket: "wedding-card-915f0.firebasestorage.app",
    messagingSenderId: "125344795647",
    appId: "1:125344795647:web:1d882c670d235f07eb35ca"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const messagesRef = collection(db, "messages");

  // 메시지 등록
  document.getElementById("messageForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nameInput = document.getElementById("guestName");
    const messageInput = document.getElementById("guestMessage");
    const name = nameInput.value.trim();
    const message = messageInput.value.trim();
    if (!name || !message) return;

    const submitBtn = e.target.querySelector("button");
    submitBtn.disabled = true;
    submitBtn.textContent = "등록 중...";

    try {
      await addDoc(messagesRef, {
        name,
        message,
        createdAt: serverTimestamp()
      });
      nameInput.value = "";
      messageInput.value = "";
    } catch (err) {
      alert("메시지 등록에 실패했습니다. 다시 시도해주세요.");
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "메시지 남기기";
    }
  });

  // 메시지 실시간 표시 (최신순)
  const q = query(messagesRef, orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    const list = document.getElementById("messageList");
    list.innerHTML = "";

    if (snapshot.empty) {
      list.innerHTML = '<p class="message-empty">첫 번째 축하 메시지를 남겨주세요! 💐</p>';
      return;
    }

    snapshot.forEach((doc) => {
      const data = doc.data();
      const item = document.createElement("div");
      item.className = "message-item";
      item.innerHTML = `<strong>${escapeHtml(data.name)}</strong><p>${escapeHtml(data.message)}</p>`;
      list.appendChild(item);
    });
  }, (error) => {
    console.error("메시지 로딩 오류:", error);
    document.getElementById("messageList").innerHTML =
      '<p class="message-empty">메시지를 불러오지 못했습니다.</p>';
  });

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }
</script>
