name: Apply wedding gallery photos once
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/wedding-gallery-once.yml'
permissions:
  contents: write
jobs:
  replace-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace encrypted gallery, keeping other sections unchanged
        run: |
          node scripts/replace-gallery-webp.js docs/assets/invitation.enc docs/images/gallery docs/index.html
          test -s docs/assets/invitation.enc
          git config user.name "wedding-card-gallery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/invitation.enc
          git rm -f docs/images/gallery/*.webp scripts/replace-gallery-webp.js .github/workflows/wedding-gallery-once.yml
          git diff --cached --check
          git commit -m "Finish gallery: remove previous photos and embed 10 optimized WebP images"
          git push
